appId: ai.drenzo.app
productName: Drenzo AI
electronDist: node_modules/electron/dist
directories:
  output: release
  buildResources: resources
files:
  - dist/**/*
  - electron-dist/**/*
asar: true
compression: maximum
protocols:
  - name: Drenzo AI Auth
    schemes:
      - drenzo
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  shortcutName: Drenzo AI
  artifactName: ${productName}-Setup-${version}.${ext}
